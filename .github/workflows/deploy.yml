# Déploiement dans le Grav partagé (<home>/shared/grav-2/user/themes/no-js/) par rsync sur SSH, comme les plugins de la boutique,
# avec les identifiants de l'hébergement (secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD ; la connexion se fait en SSH).
# Miroir : le dossier du serveur devient identique au dépôt (fichiers en trop supprimés) — possible car il ne contient ni
# configuration de site ni donnée (dossier partagé). Chaque fichier remplacé ou supprimé est d'abord gardé dans <home>/tmp/deploy-backups/grav-theme-no-js/<date>/. Variables facultatives : SSH_HOST, SSH_PORT, GRAV_USER_DIR.
name: Déploiement (rsync/ssh)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Syntaxe PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - name: php -l
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l > /dev/null

  deploy:
    name: Envoi rsync/ssh
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Outils (sshpass, rsync)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync > /dev/null
      - name: Envoi vers shared/grav-2/user/themes/no-js
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          USER_DIR: ${{ vars.GRAV_USER_DIR }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "$SSHPASS" ] || [ -z "$REMOTE_HOST" ] || [ -z "$REMOTE_USER" ]; then
            echo "::error::Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD absents."
            exit 1
          fi
          BASE="/home/$REMOTE_USER"
          UDIR="${USER_DIR:-$BASE/shared/grav-2/user}"
          UDIR="${UDIR%/}"
          DEST="$UDIR/themes/no-js"
          # Hôte SSH : variable SSH_HOST, sinon FTP_SERVER ; chez OVH, « ftp.clusterNNN… » a pour équivalent « ssh.clusterNNN… ».
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o PubkeyAuthentication=no"
          HOST=""
          for h in $SSH_HOST $REMOTE_HOST $(echo "$REMOTE_HOST" | sed -n 's/^ftp\./ssh./p'); do
            # Garde-fou : le dossier user du Grav partagé doit exister (on ne crée jamais une arborescence au hasard).
            if sshpass -e ssh $SSH_OPTS "$REMOTE_USER@$h" "test -d '$UDIR/themes'" 2>/tmp/ssh.err; then HOST="$h"; break; fi
            echo "Connexion ou dossier refusé via un des hôtes essayés : $(tail -1 /tmp/ssh.err || true)"
          done
          if [ -z "$HOST" ]; then
            echo "::error::Connexion SSH impossible, ou dossier $UDIR/themes absent."
            exit 1
          fi
          STAMP="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          BACKUP="$BASE/tmp/deploy-backups/grav-theme-no-js/$STAMP"
          # Miroir (--delete) : fichiers en trop supprimés ; --backup : tout fichier remplacé ou supprimé est gardé dans $BACKUP.
          sshpass -e rsync -rltzc -i --delete --backup --backup-dir="$BACKUP" \
            --exclude '/.git' --exclude '/.github' --exclude '/.gitignore' --exclude '/AGENTS.md' \
            -e "ssh $SSH_OPTS" ./ "$REMOTE_USER@$HOST:$DEST/"
          echo "Déployé dans $DEST (anciennes versions des fichiers remplacés : $BACKUP, s'il y en a)."
